<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigSmall - High Stakes Dice</title>
    <style>
:root {
    --bg-dark: #0a0b10;
    --card-bg: #141621;
    --accent-gold: #ffcc00;
    --accent-blue: #00d2ff;
    --accent-red: #ff2d55;
    --accent-green: #2ecc71;
    --text-main: #ffffff;
    --text-muted: #8a8e9e;
    --font-primary: 'Inter', sans-serif;
    --font-display: 'Outfit', sans-serif;
    --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-primary);
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 900px;
    height: 85vh;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background-image:
        radial-gradient(circle at 50% -20%, rgba(255, 204, 0, 0.1), transparent 50%),
        radial-gradient(circle at center, rgba(0, 210, 255, 0.05), transparent 80%);
}

/* Header */
.game-header {
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.logo-text {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo-text .accent {
    color: var(--accent-gold);
}

.balance-container {
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 25px;
    border-radius: 50px;
    text-align: center;
    border: 1px solid rgba(255, 204, 0, 0.2);
}

.balance-label {
    display: block;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: 2px;
}

.balance-value {
    color: var(--accent-gold);
    font-weight: 900;
    font-size: 1.2rem;
    font-family: var(--font-display);
}

.home-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    padding: 8px 15px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.75rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
    margin-right: 15px;
}

.home-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

/* Game Main */
.game-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 40px;
    gap: 20px;
    align-items: center;
}

/* Dice Zone */
.dice-zone {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
}

.dice-container {
    display: flex;
    gap: 30px;
    padding: 40px;
    transform-style: preserve-3d;
}

.dice {
    width: 60px;
    height: 60px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.5s cubic-bezier(0.15, 0, 0.15, 1);
}

.face {
    position: absolute;
    width: 60px;
    height: 60px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    color: #333;
    backface-visibility: hidden;
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
}

/* Dots Styling */
.face::before {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #333;
}

/* We'll handle dot positions in JS or simplified CSS */
.dice .front {
    transform: rotateY(0deg) translateZ(30px);
    background: #eee;
}

.dice .back {
    transform: rotateY(180deg) translateZ(30px);
    background: #eee;
}

.dice .right {
    transform: rotateY(90deg) translateZ(30px);
    background: #eee;
}

.dice .left {
    transform: rotateY(-90deg) translateZ(30px);
    background: #eee;
}

.dice .top {
    transform: rotateX(90deg) translateZ(30px);
    background: #eee;
}

.dice .bottom {
    transform: rotateX(-90deg) translateZ(30px);
    background: #eee;
}

/* Result Display */
.result-display {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 20px;
    text-align: center;
}

.total-display {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent-gold);
    margin-top: 5px;
}

/* Controls */
.controls-container {
    width: 100%;
    background: rgba(0, 0, 0, 0.15);
    padding: 25px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.selection-panel {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.choice-btn {
    flex: 1;
    padding: 20px;
    border-radius: 16px;
    border: 2px solid #2a2e3e;
    background: #1c1f2d;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.choice-btn.active {
    border-color: var(--accent-gold);
    background: rgba(255, 204, 0, 0.1);
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(255, 204, 0, 0.1);
}

.choice-label {
    font-size: 1.4rem;
    font-weight: 900;
    color: white;
}

.choice-odds {
    font-size: 0.8rem;
    color: var(--accent-gold);
    font-weight: 800;
    margin-top: 4px;
}

.choice-range {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 2px;
}

.bet-panel {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 30px;
}

.bet-input-group {
    flex: 1;
}

.config-label {
    display: block;
    font-size: 0.65rem;
    font-weight: 900;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 1px;
}

.input-wrapper {
    display: flex;
    align-items: center;
    background: #1c1f2d;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin-bottom: 12px;
}

.adjust-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #2a2e3e;
    background: transparent;
    color: white;
    font-weight: 900;
    cursor: pointer;
    transition: var(--transition);
}

.adjust-btn:hover {
    background: #2a2e3e;
}

#bet-amount {
    background: transparent;
    border: none;
    color: white;
    width: 100%;
    text-align: center;
    font-weight: 800;
    font-size: 1.3rem;
    outline: none;
}

.quick-bets {
    display: flex;
    gap: 8px;
}

.quick-btn {
    flex: 1;
    background: #2a2e3e;
    border: none;
    color: var(--text-muted);
    padding: 6px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 800;
    cursor: pointer;
    transition: var(--transition);
}

.quick-btn:hover {
    background: #363b4e;
    color: white;
}

.roll-btn {
    width: 200px;
    height: 80px;
    border-radius: 16px;
    border: none;
    background: var(--accent-gold);
    color: black;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: var(--transition);
    box-shadow: 0 10px 30px rgba(255, 204, 0, 0.3);
}

.roll-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    background: #ffdb4d;
}

.roll-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-primary-text {
    font-family: var(--font-display);
    font-weight: 1000;
    font-size: 1.4rem;
}

.btn-secondary-text {
    font-weight: 700;
    font-size: 0.85rem;
    opacity: 0.8;
}

/* Dash Styling on Dice Faces */
.face.f1::before {
    box-shadow: 0 0 0 #333;
}

.face.f2::before {
    box-shadow: -15px -15px 0 #333, 15px 15px 0 #333;
    background: transparent;
}

.face.f3::before {
    box-shadow: -15px -15px 0 #333, 15px 15px 0 #333;
}

.face.f4::before {
    box-shadow: -15px -15px 0 #333, 15px -15px 0 #333, -15px 15px 0 #333, 15px 15px 0 #333;
    background: transparent;
}

.face.f5::before {
    box-shadow: -15px -15px 0 #333, 15px -15px 0 #333, -15px 15px 0 #333, 15px 15px 0 #333;
}

.face.f6::before {
    box-shadow: -15px -15px 0 #333, 15px -15px 0 #333, -15px 15px 0 #333, 15px 15px 0 #333, -15px 0 0 #333, 15px 0 0 #333;
    background: transparent;
}

/* Notification */
#notification-area {
    position: fixed;
    top: 100px;
    right: 20px;
    z-index: 1000;
    pointer-events: none;
}

/* Animations */
@keyframes shakeCup {
    0% {
        transform: translate(0, 0) rotate(0deg);
    }

    25% {
        transform: translate(-10px, 10px) rotate(-5deg);
    }

    50% {
        transform: translate(10px, -10px) rotate(5deg);
    }

    75% {
        transform: translate(-10px, -10px) rotate(-5deg);
    }

    100% {
        transform: translate(0, 0) rotate(0deg);
    }
}

.shaking {
    animation: shakeCup 0.4s infinite;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 600px) {
    .app-container {
        height: 100dvh;
        border-radius: 0;
    }

    .game-main {
        padding: 15px;
    }

    .dice-container {
        gap: 10px;
        padding: 20px;
    }

    .dice {
        width: 45px;
        height: 45px;
    }

    .face {
        width: 45px;
        height: 45px;
        font-size: 1.2rem;
    }

    .face::before {
        width: 6px;
        height: 6px;
    }

    /* Adjust dash positions for smaller dice */
    .face.f2::before {
        box-shadow: -10px -10px 0 #333, 10px 10px 0 #333;
    }

    .face.f3::before {
        box-shadow: -10px -10px 0 #333, 10px 10px 0 #333;
    }

    .face.f4::before {
        box-shadow: -10px -10px 0 #333, 10px -10px 0 #333, -10px 10px 0 #333, 10px 10px 0 #333;
    }

    .face.f5::before {
        box-shadow: -10px -10px 0 #333, 10px -10px 0 #333, -10px 10px 0 #333, 10px 10px 0 #333;
    }

    .face.f6::before {
        box-shadow: -10px -10px 0 #333, 10px -10px 0 #333, -10px 10px 0 #333, 10px 10px 0 #333, -10px 0 0 #333, 10px 0 0 #333;
    }

    .choice-label {
        font-size: 1.1rem;
    }

    .bet-panel {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
    }

    .roll-btn {
        width: 100%;
        height: 65px;
    }
}

    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                <div class="home-btn" onclick="GameBridge.goHome()">
                    <i class="fas fa-home"></i> <span>HOME</span>
                </div>
                <span class="logo-text">BIG<span class="accent">SMALL</span></span>
            </div>
            <div class="balance-container">
                <span class="balance-label">BALANCE</span>
                <span class="balance-value" id="balance-amount">$0.00</span>
            </div>
        </header>

        <main class="game-main">
            <!-- Dice Zone -->
            <div class="dice-zone">
                <div class="dice-cup" id="dice-cup">
                    <div class="dice-container" id="dice-container">
                        <!-- Dice 1 -->
                        <div class="dice" id="dice-1">
                            <div class="face front"></div>
                            <div class="face back"></div>
                            <div class="face top"></div>
                            <div class="face bottom"></div>
                            <div class="face right"></div>
                            <div class="face left"></div>
                        </div>
                        <!-- Dice 2 -->
                        <div class="dice" id="dice-2">
                            <div class="face front"></div>
                            <div class="face back"></div>
                            <div class="face top"></div>
                            <div class="face bottom"></div>
                            <div class="face right"></div>
                            <div class="face left"></div>
                        </div>
                        <!-- Dice 3 -->
                        <div class="dice" id="dice-3">
                            <div class="face front"></div>
                            <div class="face back"></div>
                            <div class="face top"></div>
                            <div class="face bottom"></div>
                            <div class="face right"></div>
                            <div class="face left"></div>
                        </div>
                    </div>
                </div>
                <div class="result-display" id="result-display">READY TO PLAY</div>
                <div class="total-display" id="total-display"></div>
            </div>

            <!-- Controls -->
            <div class="controls-container">
                <div class="selection-panel">
                    <button class="choice-btn small" data-choice="small">
                        <span class="choice-label">SMALL</span>
                        <span class="choice-odds">2x</span>
                        <span class="choice-range">4-10</span>
                    </button>
                    <button class="choice-btn big" data-choice="big">
                        <span class="choice-label">BIG</span>
                        <span class="choice-odds">2x</span>
                        <span class="choice-range">11-17</span>
                    </button>
                </div>

                <div class="bet-panel">
                    <div class="bet-input-group">
                        <label class="config-label">BET AMOUNT</label>
                        <div class="input-wrapper">
                            <button class="adjust-btn" id="minus-bet">-</button>
                            <input type="number" id="bet-amount" value="10" step="1" min="1">
                            <button class="adjust-btn" id="plus-bet">+</button>
                        </div>
                        <div class="quick-bets" role="group" aria-label="Quick bet amounts">
                            <span class="quick-label">QUICK BET</span>
                            <button class="quick-btn" data-val="10">10</button>
                            <button class="quick-btn" data-val="50">50</button>
                            <button class="quick-btn" data-val="100">100</button>
                            <button class="quick-btn" data-val="500">500</button>
                        </div>

    <script>
// Game Configuration
const CONFIG = {
    MIN_BET: 1,
    MAX_BET: 10000,
    DICE_VALUES: {
        1: [0, 0, 0], // x, y, z rotation
        2: [0, 90, 0],
        3: [90, 0, 0],
        4: [-90, 0, 0],
        5: [0, -90, 0],
        6: [0, 180, 0]
    }
};

// State
let balance = GameBridge.getBalance();
let currentBet = 10;
let selectedChoice = 'small';
let isRolling = false;
let winChance = 50; // Admin-configurable win chance (%)

// Load admin-configured win chance
GameBridge.getGameConfig().then(cfg => {
    if (cfg && typeof cfg.winChance === 'number') winChance = cfg.winChance;
});
GameBridge.onGameConfigUpdate(cfg => {
    if (cfg && typeof cfg.winChance === 'number') winChance = cfg.winChance;
});

// DOM Elements
const balanceDisplay = document.getElementById('balance-amount');
const betInput = document.getElementById('bet-amount');
const btnBetInfo = document.getElementById('btn-bet-info');
const diceCup = document.getElementById('dice-cup');
const resultDisplay = document.getElementById('result-display');
const totalDisplay = document.getElementById('total-display');
const rollBtn = document.getElementById('roll-btn');
const choiceBtns = document.querySelectorAll('.choice-btn');

function init() {
    if (!GameBridge.isLoggedIn()) {
        notify('Please login to play!', 'err');
    }
    updateBalanceDisplay();
    updateBetDisplay();
    setupDiceFaces();
    addEventListeners();

    // Set default choice
    document.querySelector('.choice-btn.small').classList.add('active');
}

function setupDiceFaces() {
    // Manually assign face classes to ensure dots are correct
    const dice = document.querySelectorAll('.dice');
    dice.forEach(d => {
        const faces = d.querySelectorAll('.face');
        faces[0].className = 'face front f1';  // 1
        faces[1].className = 'face back f6';   // 6
        faces[2].className = 'face top f3';    // 3
        faces[3].className = 'face bottom f4'; // 4
        faces[4].className = 'face right f2';  // 2
        faces[5].className = 'face left f5';   // 5
    });
}

function updateBalanceDisplay() {
    balanceDisplay.innerText = `৳${balance.toFixed(2)}`;
}

function updateBetDisplay() {
    const val = parseFloat(betInput.value) || 0;
    btnBetInfo.innerText = `${GameBridge.formatBetAmount(val)} ৳`;
}

function addEventListeners() {
    // Bet adjustments
    document.getElementById('plus-bet').addEventListener('click', () => {
        if (isRolling) return;
        betInput.value = GameBridge.formatBetAmount(parseFloat(betInput.value) + 10);
        updateBetDisplay();
    });

    document.getElementById('minus-bet').addEventListener('click', () => {
        if (isRolling) return;
        let val = parseFloat(betInput.value);
        if (val > 10) {
            betInput.value = GameBridge.formatBetAmount(val - 10);
            updateBetDisplay();
        }
    });

    betInput.addEventListener('input', updateBetDisplay);

    // Quick bets
    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (isRolling) return;
            betInput.value = btn.dataset.val;
            updateBetDisplay();
        });
    });

    // Choice Selection
    choiceBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (isRolling) return;
            choiceBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedChoice = btn.dataset.choice;
        });
    });

    // Main Action
    rollBtn.addEventListener('click', handleRoll);
}

// Generate three dice values that add up to the given total (3-18)
function randomDiceForTotal(total) {
    let a, b, c;
    do {
        a = Math.floor(Math.random() * 6) + 1;
        b = Math.floor(Math.random() * 6) + 1;
        c = total - a - b;
    } while (c < 1 || c > 6);
    return [a, b, c];
}

// Pick a dice total consistent with the desired win/lose outcome for the chosen side
function pickTotal(shouldWin, selected) {
    const smallTotals = [4, 5, 6, 7, 8, 9, 10];
    const bigTotals = [11, 12, 13, 14, 15, 16, 17];
    const tripleTotals = [3, 18]; // always a house win

    let pool;
    if (shouldWin) {
        pool = selected === 'small' ? smallTotals : bigTotals;
    } else {
        pool = selected === 'small' ? bigTotals.concat(tripleTotals) : smallTotals.concat(tripleTotals);
    }
    return pool[Math.floor(Math.random() * pool.length)];
}

async function handleRoll() {
    if (!GameBridge.isLoggedIn()) {
        notify('Please login first!', 'err');
        return;
    }

    const amount = parseFloat(betInput.value);
    if (amount > balance) {
        notify('Insufficient funds!', 'err');
        return;
    }

    if (isRolling) return;

    // 1. Prepare for Sync
    const newBalance = balance - amount;

    // 2. Sync deduction to database
    const sync = await GameBridge.updateBalance(newBalance, -amount, `Bet on BigSmall`);

    if (sync && sync.error) {
        notify('Sync Error: Bet failed. Try again.', 'err');
        return;
    }

    // 3. Start Animation
    isRolling = true;
    balance = newBalance;
    updateBalanceDisplay();

    rollBtn.disabled = true;
    diceCup.classList.add('shaking');
    resultDisplay.innerText = "ROLLING...";
    totalDisplay.innerText = "";

    // Generate results (biased by admin-configured win chance)
    const shouldWin = Math.random() * 100 < winChance;
    const targetTotal = pickTotal(shouldWin, selectedChoice);
    const results = randomDiceForTotal(targetTotal);
    const total = results.reduce((a, b) => a + b, 0);

    setTimeout(() => {
        diceCup.classList.remove('shaking');

        // Rotate Dice
        results.forEach((val, i) => {
            const d = document.getElementById(`dice-${i + 1}`);
            // Add some extra random spins
            const extraX = Math.floor(Math.random() * 4) * 360;
            const extraY = Math.floor(Math.random() * 4) * 360;

            let rotX = 0, rotY = 0;
            if (val === 1) { rotX = 0; rotY = 0; }
            if (val === 6) { rotX = 180; rotY = 0; }
            if (val === 3) { rotX = -90; rotY = 0; }
            if (val === 4) { rotX = 90; rotY = 0; }
            if (val === 2) { rotX = 0; rotY = -90; }
            if (val === 5) { rotX = 0; rotY = 90; }

            d.style.transform = `rotateX(${rotX + extraX}deg) rotateY(${rotY + extraY}deg)`;
        });

        setTimeout(async () => {
            // Determine result
            let resultType = '';
            // Rules: 4-10 is Small, 11-17 is Big. 3 and 18 are "Triples" (House usually wins both)
            if (total >= 4 && total <= 10) resultType = 'small';
            else if (total >= 11 && total <= 17) resultType = 'big';
            else resultType = 'triple'; // 3 or 18

            const won = resultType === selectedChoice;
            totalDisplay.innerText = `TOTAL: ${total}`;

            if (won) {
                const winMult = 2;
                const winAmount = GameBridge.calculatePayout(amount, winMult);
                balance += winAmount;
                updateBalanceDisplay();

                // Sync win
                await GameBridge.updateBalance(balance, winAmount, `Win on BigSmall`);

                resultDisplay.innerText = `YOU WON! (${resultType.toUpperCase()}) • ${winMult.toFixed(2)}x`;
                resultDisplay.style.color = 'var(--accent-green)';
                notify(`WON ৳${winAmount.toFixed(2)} (${winMult.toFixed(2)}x)`, 'win');
            } else {
                resultDisplay.innerText = resultType === 'triple' ? "TRIPLE! HOUSE WINS" : `YOU LOST! (${resultType.toUpperCase()})`;
                resultDisplay.style.color = 'var(--accent-red)';
                notify(`LOST ৳${amount.toFixed(2)}`, 'err');
            }

            isRolling = false;
            rollBtn.disabled = false;

            if (document.getElementById('auto-spin-switch').checked && !isRolling) {
                setTimeout(handleRoll, 300);
            }
        }, 1500);

    }, 1000);
}

function notify(text, type) {
    const area = document.getElementById('notification-area');
    if (!area) return;
    const note = document.createElement('div');
    note.style.cssText = `
        background: ${type === 'win' ? '#2ecc71' : '#ff2d55'};
        color: white; padding: 12px 25px; border-radius: 12px;
        margin-bottom: 10px; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    `;
    note.innerText = text;
    area.appendChild(note);

    setTimeout(() => {
        note.style.transform = 'translateY(0)';
        note.style.opacity = '1';
    }, 10);

    setTimeout(() => {
        note.style.transform = 'translateY(-20px)';
        note.style.opacity = '0';
        setTimeout(() => note.remove(), 300);
    }, 4000);
}

init();

    </script>
