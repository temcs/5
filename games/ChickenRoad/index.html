<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Road - Cross &amp; Cash Out</title>
    <style>
        :root {
            --dusk-top: #180f3a;
            --dusk-mid: #4b2170;
            --dusk-horizon: #ff7a45;
            --card-bg: #12101f;
            --asphalt: #2a2f3d;
            --asphalt-lit: #3b4256;
            --gold: #ffd23f;
            --gold-deep: #ffa800;
            --neon: #39ff88;
            --red: #ff3b5c;
            --text-main: #ffffff;
            --text-muted: #9aa0b4;
            --font-primary: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #06060c;
            color: var(--text-main);
            font-family: var(--font-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 560px;
            height: 94vh;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            position: relative;
        }

        .app-container.shake {
            animation: screenshake 0.45s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes screenshake {

            10%,
            90% {
                transform: translate(-2px, 0);
            }

            20%,
            80% {
                transform: translate(4px, -2px);
            }

            30%,
            50%,
            70% {
                transform: translate(-6px, 2px);
            }

            40%,
            60% {
                transform: translate(6px, -1px);
            }
        }

        /* ===== Header ===== */
        .game-header {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
            z-index: 5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .home-btn {
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 11px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.7rem;
            font-weight: 800;
            transition: var(--transition);
        }

        .home-btn:hover {
            background: rgba(255, 210, 63, 0.22);
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .logo-text .accent {
            color: var(--gold);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-container {
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 210, 63, 0.25);
            text-align: center;
            min-width: 108px;
        }

        .balance-label {
            display: block;
            font-size: 0.52rem;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .balance-value {
            color: var(--gold);
            font-weight: 900;
            font-size: 1rem;
            font-family: var(--font-display);
        }

        .balance-value.bump {
            animation: bump 0.35s ease;
        }

        @keyframes bump {
            50% {
                transform: scale(1.25);
                color: var(--neon);
            }
        }

        .sound-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .sound-btn.muted {
            opacity: 0.45;
        }

        /* ===== Road viewport ===== */
        .road-viewport {
            position: relative;
            flex: 1;
            min-height: 240px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--dusk-top) 0%, var(--dusk-mid) 42%, var(--dusk-horizon) 100%);
        }

        .sun {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 170, 90, 0.9), rgba(255, 120, 60, 0) 68%);
            filter: blur(2px);
            pointer-events: none;
        }

        .road-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
            will-change: transform;
        }

        /* Finish banner */
        .finish {
            margin: 6px 12px 8px;
            padding: 10px;
            border-radius: 14px;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 900;
            letter-spacing: 2px;
            color: #1a1200;
            background: repeating-linear-gradient(45deg, #ffd23f 0 14px, #ffb400 14px 28px);
            box-shadow: 0 0 22px rgba(255, 200, 60, 0.5);
            flex-shrink: 0;
        }

        .finish small {
            display: block;
            font-size: 0.6rem;
            letter-spacing: 1px;
            opacity: 0.75;
        }

        /* Lane */
        .lane {
            position: relative;
            height: 62px;
            margin: 0 12px 8px;
            border-radius: 12px;
            background: var(--asphalt);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            flex-shrink: 0;
            transition: background 0.35s, box-shadow 0.35s, border-color 0.35s;
        }

        .lane::after {
            /* glowing painted center line */
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 4px;
            transform: translateY(-50%);
            background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0 22px, transparent 22px 46px);
            opacity: 0.55;
            transition: opacity 0.3s, box-shadow 0.3s;
        }

        .lane .lamp {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: #ffd98a;
            box-shadow: 0 0 14px 4px rgba(255, 200, 90, 0.65);
        }

        .lane .lamp.left {
            left: 6px;
        }

        .lane .lamp.right {
            right: 6px;
        }

        /* Traffic */
        .lane .traffic {
            position: absolute;
            inset: 0;
            transition: opacity 0.32s;
            z-index: 2;
        }

        .lane.cleared .traffic,
        .lane.passed .traffic {
            opacity: 0;
        }

        .lane.traffic-crash .traffic {
            z-index: 9;
        }

        .lane.traffic-crash .car {
            filter: drop-shadow(0 0 12px rgba(255, 59, 92, 0.95)) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.55));
        }

        .car {
            position: absolute;
            top: 50%;
            left: -60%;
            transform: translateY(-50%);
            font-size: 1.85rem;
            line-height: 1;
            will-change: left;
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.55));
        }

        /* headlight glow */
        .car::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 42px;
            height: 14px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(255, 230, 150, 0.5), rgba(255, 230, 150, 0) 70%);
            border-radius: 50%;
            z-index: -1;
        }

        /* Multiplier badge */
        .badge {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(20, 22, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 4px 10px;
            text-align: center;
            z-index: 3;
            transition: var(--transition);
        }

        .badge .badge-mult {
            display: block;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 0.95rem;
            color: #cdd2e0;
            line-height: 1;
        }

        .badge .badge-num {
            display: block;
            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Lane states */
        .lane.locked {
            filter: brightness(0.62);
        }

        .lane.active {
            border-color: var(--neon);
            box-shadow: 0 0 0 2px rgba(57, 255, 136, 0.35), 0 0 26px rgba(57, 255, 136, 0.35) inset;
            animation: targetPulse 1.1s ease-in-out infinite;
        }

        @keyframes targetPulse {

            0%,
            100% {
                box-shadow: 0 0 0 2px rgba(57, 255, 136, 0.3), 0 0 18px rgba(57, 255, 136, 0.25) inset;
            }

            50% {
                box-shadow: 0 0 0 4px rgba(57, 255, 136, 0.6), 0 0 34px rgba(57, 255, 136, 0.5) inset;
            }
        }

        .lane.active .badge {
            border-color: var(--neon);
            color: var(--neon);
        }

        .lane.active .badge .badge-mult {
            color: var(--neon);
        }

        .lane.passed {
            background: linear-gradient(180deg, rgba(255, 210, 63, 0.16), rgba(57, 255, 136, 0.1));
            border-color: rgba(255, 210, 63, 0.5);
        }

        .lane.passed::after {
            opacity: 1;
            box-shadow: 0 0 12px rgba(255, 210, 63, 0.8);
        }

        .lane.passed .badge {
            border-color: var(--gold);
            background: rgba(255, 210, 63, 0.16);
        }

        .lane.passed .badge .badge-mult {
            color: var(--gold);
        }

        .lane.flash {
            animation: laneFlash 0.6s ease;
        }

        @keyframes laneFlash {
            0% {
                box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.9), 0 0 40px rgba(255, 210, 63, 0.7) inset;
                background: #fff3c4;
            }

            100% {
                box-shadow: none;
            }
        }

        .lane.crashed {
            background: repeating-linear-gradient(45deg, #3a1520 0 16px, #4a1a28 16px 32px);
            border-color: var(--red);
        }

        .lane.crashed::after {
            opacity: 0.25;
        }

        .lane.crashed .badge {
            border-color: var(--red);
            background: rgba(255, 59, 92, 0.2);
        }

        .lane.crashed .badge .badge-mult {
            color: var(--red);
        }

        .badge.pop {
            animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes badgePop {
            0% {
                transform: translateY(-50%) scale(0.4);
            }

            60% {
                transform: translateY(-50%) scale(1.35);
            }

            100% {
                transform: translateY(-50%) scale(1);
            }
        }

        /* Start pad / curb */
        .start-pad {
            position: relative;
            height: 84px;
            margin: 0 12px;
            border-radius: 12px 12px 0 0;
            background: linear-gradient(180deg, #2f3546, #232838);
            border-top: 3px dashed rgba(255, 210, 63, 0.55);
            flex-shrink: 0;
        }

        .start-pad .start-label {
            position: absolute;
            left: 12px;
            top: 76%;
            transform: translateY(-50%);
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            opacity: 0.75;
        }

        /* ===== Chicken ===== */
        .chicken-layer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 14px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            z-index: 6;
        }

        .chicken {
            position: relative;
            transform-origin: 50% 100%;
        }

        .chicken-svg {
            width: 104px;
            height: 104px;
            overflow: visible;
            transform-origin: 50% 100%;
        }

        .chicken-svg g {
            transform-box: fill-box;
            transform-origin: center;
        }

        #chick-head {
            transform-origin: 22% 92%;
        }

        .hidden {
            display: none !important;
        }

        /* idle animation */
        .chicken.idle #chick-body {
            animation: idleBob 1.25s ease-in-out infinite;
        }

        .chicken.idle #chick-head {
            animation: idlePeck 3s ease-in-out infinite;
        }

        .chicken.idle #chick-tail {
            animation: tailWiggle 0.7s ease-in-out infinite;
        }

        .chicken.idle #chick-eye {
            animation: blink 4.2s infinite;
        }

        @keyframes idleBob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes idlePeck {

            0%,
            70%,
            100% {
                transform: rotate(0deg);
            }

            78% {
                transform: rotate(16deg) translateY(4px);
            }

            88% {
                transform: rotate(-4deg);
            }
        }

        @keyframes tailWiggle {

            0%,
            100% {
                transform: rotate(-4deg);
            }

            50% {
                transform: rotate(6deg);
            }
        }

        @keyframes blink {

            0%,
            92%,
            100% {
                transform: scaleY(1);
            }

            95% {
                transform: scaleY(0.1);
            }
        }

        /* ready / runner stance */
        .chicken.ready {
            animation: readyShake 0.35s ease 2;
        }

        @keyframes readyShake {

            0%,
            100% {
                transform: rotate(0) scale(1);
            }

            25% {
                transform: rotate(-5deg) scale(1.06);
            }

            75% {
                transform: rotate(5deg) scale(1.06);
            }
        }

        /* jump */
        .chicken.jumping {
            animation: jumpArc var(--jump-dur, 0.46s) ease;
        }

        @keyframes jumpArc {
            0% {
                transform: translateY(0) scale(1);
            }

            12% {
                transform: translateY(2px) scaleY(0.78) scaleX(1.12);
            }

            30% {
                transform: translateY(-10px) scaleY(0.96) scaleX(1.02);
            }

            58% {
                transform: translateY(-42px) scaleY(1.06) scaleX(0.96);
            }

            80% {
                transform: translateY(-8px) scaleY(1);
            }

            100% {
                transform: translateY(0) scaleY(1);
            }
        }

        .chicken.jumping #chick-wing {
            animation: flap 0.14s ease-in-out 3;
        }

        @keyframes flap {
            50% {
                transform: rotate(-38deg) scaleY(1.15);
            }
        }

        /* winning */
        .chicken.winning #chick-body {
            animation: victoryDance 0.4s ease-in-out infinite;
        }

        .chicken.winning #chick-sunnies,
        .chicken.winning #chick-bags {
            display: block;
        }

        @keyframes victoryDance {

            0%,
            100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-6px) rotate(4deg);
            }
        }

        /* drumstick */
        .drumstick {
            position: relative;
            text-align: center;
        }

        .drumstick .drum {
            font-size: 3.4rem;
            display: inline-block;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.6));
            animation: drumBounce 0.5s ease;
        }

        .drumstick .stars {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            animation: spinStars 1.4s linear infinite;
        }

        .drumstick .steam {
            position: absolute;
            top: -26px;
            left: 50%;
            font-size: 1.1rem;
            opacity: 0.6;
            animation: steam 1.6s ease-in-out infinite;
        }

        @keyframes drumBounce {
            0% {
                transform: scale(0.4) rotate(-30deg);
            }

            60% {
                transform: scale(1.18) rotate(8deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        @keyframes spinStars {
            from {
                transform: translateX(-50%) rotate(0);
            }

            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }

        @keyframes steam {
            0% {
                transform: translate(-50%, 6px);
                opacity: 0;
            }

            40% {
                opacity: 0.6;
            }

            100% {
                transform: translate(-50%, -14px);
                opacity: 0;
            }
        }

        /* ===== FX layer ===== */
        .fx-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 7;
        }

        .feather {
            position: absolute;
            width: 14px;
            height: 8px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: #fdf6e3;
            box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.08);
        }

        .dust {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(210, 205, 190, 0.75);
        }

        .confetti {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            top: -20px;
        }

        .poof {
            position: absolute;
            border-radius: 50%;
            background: rgba(220, 220, 220, 0.7);
        }

        /* the car that hits the chicken on a crash */
        .hit-car {
            position: absolute;
            left: -80px;
            font-size: 2.4rem;
            line-height: 1;
            z-index: 8;
            transform: translateY(-50%);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
        }

        /* ===== Stats ===== */
        .stats-row {
            display: flex;
            gap: 8px;
            padding: 8px 14px 0;
            flex-shrink: 0;
        }

        .stat {
            flex: 1;
            background: rgba(0, 0, 0, 0.32);
            border-radius: 12px;
            padding: 6px 4px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat span {
            display: block;
            font-size: 0.5rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .stat b {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--gold);
        }

        .status-banner {
            margin: 8px 14px 0;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-muted);
            flex-shrink: 0;
            min-height: 34px;
            transition: var(--transition);
        }

        .status-banner.win {
            background: linear-gradient(90deg, rgba(57, 255, 136, 0.25), rgba(255, 210, 63, 0.25));
            color: var(--neon);
        }

        .status-banner.lose {
            background: rgba(255, 59, 92, 0.22);
            color: var(--red);
        }

        /* ===== Controls ===== */
        .controls-container {
            background: rgba(0, 0, 0, 0.28);
            padding: 12px 14px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .difficulty-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .diff-chip {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 11px;
            padding: 6px 4px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .diff-chip .diff-name {
            display: block;
            font-size: 0.66rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .diff-chip .diff-meta {
            display: block;
            font-size: 0.56rem;
            margin-top: 1px;
            opacity: 0.85;
        }

        .diff-chip.active {
            background: rgba(255, 210, 63, 0.14);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 14px rgba(255, 210, 63, 0.18);
        }

        .diff-chip.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .bet-panel {
            display: flex;
            align-items: stretch;
            gap: 12px;
        }

        .bet-input-group {
            flex: 0.95;
            background: rgba(0, 0, 0, 0.35);
            padding: 8px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 4px;
        }

        .adjust-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 210, 63, 0.15);
            color: var(--gold);
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }

        .adjust-btn:active {
            background: rgba(255, 210, 63, 0.3);
        }

        #bet-amount {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            outline: none;
            font-family: var(--font-display);
            -moz-appearance: textfield;
        }

        #bet-amount::-webkit-outer-spin-button,
        #bet-amount::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .quick-bets {
            display: flex;
            gap: 4px;
        }

        .quick-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #cdd2e0;
            padding: 5px 2px;
            border-radius: 7px;
            font-size: 0.66rem;
            font-weight: 800;
            cursor: pointer;
        }

        .quick-btn:active {

    <script>
        // ---------------------------------------------------------------------------
        // Chicken Road - Cross & Cash Out (animated cartoon edition)
        // The chicken hops lane by lane across a dusk road. Each safe lane raises the
        // multiplier and lets the player cash out; one bad landing roasts the chicken
        // and loses the bet. The per-step survival chance is set from the admin panel.
        // ---------------------------------------------------------------------------

        const DIFFICULTIES = {
            // Growth tuned so the final lane of each difficulty reaches ~50x
            easy: { label: 'EASY', lanes: 8, growth: 1.70 },
            medium: { label: 'MEDIUM', lanes: 10, growth: 1.51 },
            hard: { label: 'HARD', lanes: 12, growth: 1.40 }
        };
        const START_MULT = 1.20;

        // ---- Admin win chance = per-step survival chance (%) ----
        let winChance = 50;
        GameBridge.getGameConfig().then(cfg => {
            if (cfg && typeof cfg.winChance === 'number') winChance = cfg.winChance;
        });
        GameBridge.onGameConfigUpdate(cfg => {
            if (cfg && typeof cfg.winChance === 'number') winChance = cfg.winChance;
        });

        // ---- State ----
        let balance = GameBridge.getBalance();
        let difficultyKey = 'medium';
        let lanes = DIFFICULTIES.medium.lanes;
        let ladder = [];
        let currentBet = 10;
        let clearedLanes = 0;
        let gameState = 'idle';   // idle | playing | won | lost
        let stepPx = 70;
        let busy = false;

        // ---- Traffic ----
        let trafficT0 = performance.now();
        let trafficCars = [];
        let trafficRaf = null;

        // ---- DOM ----
        const app = document.getElementById('app');
        const balanceDisplay = document.getElementById('balance-amount');
        const betInput = document.getElementById('bet-amount');
        const track = document.getElementById('road-track');
        const viewport = document.getElementById('road-viewport');
        const fxLayer = document.getElementById('fx-layer');
        const difficultyRow = document.getElementById('difficulty-row');
        const laneDisplay = document.getElementById('lane-display');
        const multDisplay = document.getElementById('mult-display');
        const cashoutDisplay = document.getElementById('cashout-display');
        const statusBanner = document.getElementById('status-banner');
        const primaryBtn = document.getElementById('primary-btn');
        const cashoutBtn = document.getElementById('cashout-btn');
        const cashoutVal = document.getElementById('cashout-val');
        const chicken = document.getElementById('chicken');
        const drumstick = document.getElementById('drumstick');
        const soundBtn = document.getElementById('sound-btn');

        // ---------------------------------------------------------------------------
        // Sound (WebAudio, no external assets)
        // ---------------------------------------------------------------------------
        const Sfx = {
            ctx: null,
            muted: false,
            hum: null,
            humGain: null,

            ensure() {
                if (this.ctx) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                } catch (e) { }
            },

            resume() {
                this.ensure();
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            },

            tone(freq, dur, type, vol, slideTo, delay) {
                if (this.muted || !this.ctx) return;
                const t0 = this.ctx.currentTime + (delay || 0);
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, t0);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(g); g.connect(this.ctx.destination);
                osc.start(t0); osc.stop(t0 + dur + 0.02);
            },

            boing() {
                this.tone(520, 0.26, 'sine', 0.16, 150);
            },

            coin() {
                this.tone(988, 0.09, 'square', 0.11);
                this.tone(1319, 0.16, 'square', 0.11, null, 0.08);
            },

            cash() {
                [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.12, null, i * 0.07));
            },

            crash() {
                if (this.muted || !this.ctx) return;
                const t0 = this.ctx.currentTime;
                const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.4, this.ctx.sampleRate);
                const d = buffer.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
                const src = this.ctx.createBufferSource();
                src.buffer = buffer;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.28, t0);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
                src.connect(g); g.connect(this.ctx.destination);
                src.start(t0);
                this.tone(180, 0.3, 'sawtooth', 0.14, 60);
            },

            startHum() {
                if (!this.ctx || this.hum) return;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 55;
                g.gain.value = this.muted ? 0 : 0.018;
                osc.connect(g); g.connect(this.ctx.destination);
                osc.start();
                this.hum = osc;
                this.humGain = g;
            },

            stopHum() {
                if (this.hum) {
                    try { this.hum.stop(); } catch (e) { }
                    this.hum = null;
                    this.humGain = null;
                }
            }
        };

        // ---------------------------------------------------------------------------
        // Ladder helpers
        // ---------------------------------------------------------------------------
        function buildLadder(growth, n) {
            const arr = [];
            for (let k = 0; k < n; k++) {
                const mult = START_MULT * Math.pow(growth, k);
                arr.push(GameBridge.capWinMultiplier(mult));
            }
            return arr;
        }

        function currentMultiplier() {
            return clearedLanes > 0 ? ladder[clearedLanes - 1] : 0;
        }

        function fmt(n) {
            return (Math.round(n * 100) / 100).toFixed(2);
        }

        // ---------------------------------------------------------------------------
        // Traffic (JS-driven; a lane stops sending cars once the chicken clears it)
        // ---------------------------------------------------------------------------
        const CAR_EMOJIS = ['🚗', '🚙', '🚕', '🚓', '🚐', '🚚', '🚌', '🏎️', '🚖', '🚘'];
        const CAR_MIN_DUR = 2.1;    // seconds to sweep a lane
        const CAR_MAX_DUR = 3.6;
        const LEFT_START = -60;     // % where a car enters
        const LEFT_END = 160;       // % where a car exits
        const CAR_SPAN = LEFT_END - LEFT_START;
        const HOP_MS = 300;         // instant-feel jump

        function frac(x) { return x - Math.floor(x); }

        // Where is a car at absolute time tMs?
        function carLeftAt(car, tMs) {
            const p = frac((tMs - trafficT0) / (car.dur * 1000) + car.offset);
            const q = car.dir === 'rl' ? 1 - p : p;
            return LEFT_START + CAR_SPAN * q;
        }

        function trafficTick(now) {
            for (let i = 0; i < trafficCars.length; i++) {
                const c = trafficCars[i];
                c.el.style.left = carLeftAt(c, now).toFixed(2) + '%';
            }
            trafficRaf = requestAnimationFrame(trafficTick);
        }

        function startTraffic() {
            if (trafficRaf) cancelAnimationFrame(trafficRaf);
            trafficRaf = requestAnimationFrame(trafficTick);
        }

        // The chicken made it across this lane -> stop sending cars here.
        function clearLaneTraffic(laneNum) {
            trafficCars = trafficCars.filter(c => c.lane !== laneNum);
        }

        // ---------------------------------------------------------------------------
        // Balance rendering
        // ---------------------------------------------------------------------------
        function renderBalance() {
            balanceDisplay.innerText = `৳${balance.toFixed(2)}`;
        }

        function animateBalance(from, to) {
            const dur = 650;
            const start = performance.now();
            function frame(t) {
                const p = Math.min(1, (t - start) / dur);
                const eased = 1 - Math.pow(1 - p, 3);
                const val = from + (to - from) * eased;
                balanceDisplay.innerText = `৳${val.toFixed(2)}`;
                if (p < 1) requestAnimationFrame(frame);
                else {
                    balanceDisplay.innerText = `৳${to.toFixed(2)}`;
                    balanceDisplay.classList.add('bump');
                    setTimeout(() => balanceDisplay.classList.remove('bump'), 360);
                }
            }
            requestAnimationFrame(frame);
        }

        // ---------------------------------------------------------------------------
        // Difficulty chips
        // ---------------------------------------------------------------------------
        function buildDifficultyChips() {
            difficultyRow.innerHTML = '';
            Object.keys(DIFFICULTIES).forEach(key => {
                const d = DIFFICULTIES[key];
                const top = Math.round(START_MULT * Math.pow(d.growth, d.lanes - 1) * 100) / 100;
                const chip = document.createElement('div');
                chip.className = 'diff-chip' + (key === difficultyKey ? ' active' : '');
                chip.dataset.key = key;
                chip.innerHTML = `<span class="diff-name">${d.label}</span><span class="diff-meta">${d.lanes} lanes • ${top.toFixed(2)}x</span>`;
                chip.addEventListener('click', () => selectDifficulty(key));
                difficultyRow.appendChild(chip);
            });
        }

        function setChipsEnabled(enabled) {
            difficultyRow.querySelectorAll('.diff-chip').forEach(c => c.classList.toggle('disabled', !enabled));
        }

        function selectDifficulty(key) {
            if (gameState === 'playing' || busy) return;
            difficultyKey = key;
            lanes = DIFFICULTIES[key].lanes;
            ladder = buildLadder(DIFFICULTIES[key].growth, lanes);
            difficultyRow.querySelectorAll('.diff-chip').forEach(c => c.classList.toggle('active', c.dataset.key === key));
            buildRoad();
            applyStates();
            updateStats();
        }

        // ---------------------------------------------------------------------------
        // Road rendering
        // ---------------------------------------------------------------------------
        function buildRoad() {
            track.style.transition = 'none';
            track.style.transform = 'translateY(0)';
            track.innerHTML = '';
            trafficCars = [];

            // Finish banner (top)
            const finish = document.createElement('div');
            finish.className = 'finish';
            finish.innerHTML = `FINISH<small>REACH THE OTHER SIDE</small>`;
            track.appendChild(finish);

            // Lanes top -> bottom (lane N at top, lane 1 just above the curb)
            for (let l = lanes; l >= 1; l--) {
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.dataset.lane = l;
                lane.innerHTML = `
                    <span class="lamp left"></span>
                    <span class="lamp right"></span>
                    <div class="badge">
                        <span class="badge-mult">${ladder[l - 1].toFixed(2)}x</span>
                        <span class="badge-num">LANE ${l}</span>
                    </div>`;

                // Continuous traffic. Three cars per lane, evenly spaced.
                const traffic = document.createElement('div');
                traffic.className = 'traffic';
                const dir = (l % 2 === 0) ? 'rl' : 'lr';
                lane.dataset.dir = dir;
                const dur = CAR_MIN_DUR + Math.random() * (CAR_MAX_DUR - CAR_MIN_DUR);
                for (let k = 0; k < 3; k++) {
                    const car = document.createElement('div');
                    car.className = 'car';
                    car.textContent = CAR_EMOJIS[Math.floor(Math.random() * CAR_EMOJIS.length)];
                    if (dir === 'lr') car.style.transform = 'translateY(-50%) scaleX(-1)';
                    traffic.appendChild(car);
                    trafficCars.push({
                        el: car,
                        lane: l,
                        dir,
                        dur,
                        offset: frac(k / 3 + Math.random() * 0.04)
                    });
                }
                lane.appendChild(traffic);

                track.appendChild(lane);
            }

            // Curb / start pad (bottom)
            const pad = document.createElement('div');
            pad.className = 'start-pad';
            pad.innerHTML = `<span class="start-label">START</span>`;
            track.appendChild(pad);

            // Measure step distance between two lanes
            const laneEls = track.querySelectorAll('.lane');
            if (laneEls.length >= 2) {
                const a = laneEls[laneEls.length - 1].getBoundingClientRect().top;   // lane 1
                const b = laneEls[laneEls.length - 2].getBoundingClientRect().top;   // lane 2
                stepPx = Math.abs(b - a) || 70;
            }

            // Re-enable transition after layout settles
            requestAnimationFrame(() => { track.style.transition = ''; });
        }

        function getLaneEl(l) {
            return track.querySelector(`.lane[data-lane="${l}"]`);
        }

        function applyStates() {
            track.querySelectorAll('.lane').forEach(lane => {
                const l = parseInt(lane.dataset.lane);
                lane.classList.remove('active', 'passed', 'locked', 'crashed');
                if (l <= clearedLanes) lane.classList.add('passed');
                else if (gameState === 'playing' && l === clearedLanes + 1) lane.classList.add('active');
                else if (gameState === 'idle' || gameState === 'playing') lane.classList.add('locked');
            });
        }

        function scrollToLane() {
            track.style.transform = `translateY(${clearedLanes * stepPx}px)`;
        }

        // ---------------------------------------------------------------------------
        // Stats / buttons
        // ---------------------------------------------------------------------------
        function updateStats() {
            const mult = currentMultiplier();
            laneDisplay.textContent = `${clearedLanes}/${lanes}`;
            multDisplay.textContent = `${(mult > 0 ? mult : 1).toFixed(2)}x`;
            const bet = parseFloat(betInput.value) || 0;
            const value = mult > 0 ? bet * mult : 0;
            cashoutDisplay.textContent = fmt(value);
            cashoutVal.innerText = fmt(value);
        }

        function refreshButtons() {
            if (gameState === 'playing') {
                primaryBtn.innerText = 'GO / JUMP ➔';
                primaryBtn.disabled = clearedLanes >= lanes || busy;
                cashoutBtn.disabled = clearedLanes < 1 || busy;
            } else {
                primaryBtn.innerText = gameState === 'idle' ? 'START RUN' : 'NEW RUN';
                primaryBtn.disabled = false;
                cashoutBtn.disabled = true;
            }
        }

        // ---------------------------------------------------------------------------
        // Events
        // ---------------------------------------------------------------------------
        function addEventListeners() {
            document.getElementById('plus-bet').addEventListener('click', () => {
                if (gameState === 'playing' || busy) return;
                betInput.value = (parseFloat(betInput.value) || 0) + 10;
                updateStats();
            });
            document.getElementById('minus-bet').addEventListener('click', () => {
                if (gameState === 'playing' || busy) return;
                const v = parseFloat(betInput.value) || 0;
                if (v > 10) { betInput.value = v - 10; updateStats(); }
            });
            betInput.addEventListener('input', () => { if (gameState !== 'playing') updateStats(); });
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (gameState === 'playing' || busy) return;
                    betInput.value = btn.dataset.val;
                    updateStats();
                });
            });

            primaryBtn.addEventListener('click', () => {
                if (gameState === 'playing') go();
                else startRun();
            });
            cashoutBtn.addEventListener('click', cashOut);

            soundBtn.addEventListener('click', () => {
                Sfx.muted = !Sfx.muted;
                soundBtn.classList.toggle('muted', Sfx.muted);
                soundBtn.innerHTML = Sfx.muted ? '<i class="fas fa-volume-xmark"></i>' : '<i class="fas fa-volume-high"></i>';
                if (Sfx.humGain) Sfx.humGain.gain.value = Sfx.muted ? 0 : 0.018;
            });
        }

        // ---------------------------------------------------------------------------
        // Gameplay
        // ---------------------------------------------------------------------------
        function setChickenState(state) {
            chicken.className = 'chicken ' + state;
            drumstick.classList.add('hidden');
        }

        async function startRun() {
            if (busy) return;
            if (!GameBridge.isLoggedIn()) { notify('Please login to play!', 'err'); return; }

            const amount = parseFloat(betInput.value) || 0;
            if (amount <= 0) { notify('Enter a valid bet amount!', 'err'); return; }
            if (amount > balance) { notify('Insufficient funds!', 'err'); return; }

            Sfx.resume();
            busy = true;
            gameState = 'playing';
            currentBet = amount;
            clearedLanes = 0;
            ladder = buildLadder(DIFFICULTIES[difficultyKey].growth, lanes);

            buildRoad();
            applyStates();
            scrollToLane();
            clearFx();
            setChickenState('ready');
            setChipsEnabled(false);
            refreshButtons();
            updateStats();

            statusBanner.className = 'status-banner';
            statusBanner.innerText = 'Get ready...';

            Sfx.startHum();
            setTimeout(() => Sfx.boing(), 120);

            // Deduct bet + sync
            const newBalance = balance - amount;
            const sync = await GameBridge.updateBalance(newBalance, -amount, 'Chicken Road Bet');
            busy = false;

            if (sync && sync.error) {
                gameState = 'idle';
                setChickenState('idle');
                setChipsEnabled(true);
                buildRoad();
                applyStates();
                updateStats();
                refreshButtons();
                Sfx.stopHum();
                statusBanner.className = 'status-banner';
                statusBanner.innerText = 'Place your bet & start the run';
                notify('Sync Error: Bet failed. Try again.', 'err');
                return;
            }
            balance = newBalance;
            renderBalance();

            setChickenState('idle');
            statusBanner.innerText = 'GO! Jump across';
            applyStates();
            updateStats();
            refreshButtons();
        }

        async function go() {
            if (gameState !== 'playing' || busy) return;
            const nextLane = clearedLanes + 1;
            if (nextLane > lanes) return;

            busy = true;
            refreshButtons();
            Sfx.boing();

            const survives = Math.random() * 100 < winChance;
            const laneEl = getLaneEl(nextLane);

            // Instant hop on click
            track.style.transition = `transform ${HOP_MS}ms cubic-bezier(0.33, 1, 0.68, 1)`;
            chicken.classList.remove('idle', 'ready');
            chicken.style.setProperty('--jump-dur', (HOP_MS / 1000) + 's');
            void chicken.offsetWidth;
            chicken.classList.add('jumping');

            if (survives) {
                clearedLanes = nextLane;
                scrollToLane();
                await wait(HOP_MS + 30);

                // Chicken made it across: it passes through the cars, then this
                // lane stops sending traffic so the road ahead is clear.
                clearLaneTraffic(nextLane);
                laneEl.classList.remove('active');
                laneEl.classList.add('passed', 'flash', 'cleared');
                const badge = laneEl.querySelector('.badge');
                badge.classList.add('pop');
                spawnDust();
                Sfx.coin();

                setTimeout(() => laneEl.classList.remove('flash'), 620);
                setTimeout(() => badge.classList.remove('pop'), 520);

                chicken.classList.remove('jumping');
                chicken.classList.add('idle');

                if (clearedLanes >= lanes) {
                    await cashOut();
                    return;
                }

                busy = false;
                applyStates();
                updateStats();
                refreshButtons();
            } else {
                await wait(HOP_MS + 10);
                chicken.classList.remove('jumping');
                crash(nextLane);
            }
        }

        async function crash(laneNum) {
            gameState = 'lost';
            const laneEl = getLaneEl(laneNum);
            Sfx.crash();

            // this lane's traffic holds still at the moment of impact
            clearLaneTraffic(laneNum);
            laneEl.classList.remove('active');
            laneEl.classList.add('traffic-crash');

            // a car from this lane slams into the chicken
            const dir = laneEl.dataset.dir || 'rl';
            const vRect = viewport.getBoundingClientRect();
            const laneRect = laneEl.getBoundingClientRect();
            const carTop = laneRect.top - vRect.top + laneRect.height / 2;

            const car = document.createElement('div');
            car.className = 'hit-car';
            car.textContent = dir === 'lr' ? '🚗' : '🚙';
            car.style.top = `${carTop}px`;
            if (dir === 'lr') car.style.transform = 'translateY(-50%) scaleX(-1)';
            fxLayer.appendChild(car);

            const startX = dir === 'rl' ? viewport.clientWidth + 40 : -80;
            const endX = viewport.clientWidth / 2 - 22;
            car.animate([
                { left: `${startX}px`, opacity: 0.2 },
                { offset: 0.35, opacity: 1 },
                { left: `${endX}px`, opacity: 1 }
            ], { duration: 170, easing: 'ease-in', fill: 'forwards' });

            await wait(150);
            shakeScreen();
            spawnPoof();
            spawnFeathers();
            await wait(170);
            car.remove();

            // chicken -> roasted drumstick
            chicken.classList.add('hidden');
            drumstick.classList.remove('hidden');

            applyStates();
            laneEl.classList.add('crashed');
            const badge = laneEl.querySelector('.badge');
            badge.querySelector('.badge-num').textContent = 'BUSTED';
            badge.querySelector('.badge-mult').textContent = 'BUSTED';
            badge.classList.add('pop');

            Sfx.stopHum();
            busy = false;
            setChipsEnabled(true);
            refreshButtons();
            updateStats();

            statusBanner.className = 'status-banner lose';
            statusBanner.innerText = 'CRASHED! Better luck next time';
            notify(`LOST ৳${currentBet.toFixed(2)} (lane ${laneNum})`, 'err');
        }

        async function cashOut() {
            if (gameState !== 'playing' || clearedLanes < 1) return;

            gameState = 'won';
            busy = true;
            Sfx.stopHum();
            Sfx.cash();

            const mult = GameBridge.capWinMultiplier(ladder[clearedLanes - 1]);
            const winAmount = currentBet * mult;
            const newBalance = balance + winAmount;

            // Victory dance + accessories
            chicken.classList.remove('jumping', 'idle');
            chicken.classList.add('winning');
            spawnConfetti();
            spawnCoinBurst();

            const from = balance;
            const winSync = await GameBridge.updateBalance(newBalance, winAmount, 'Chicken Road Win');
            if (winSync && winSync.error) {
                notify('Sync Error: Winnings not saved!', 'err');
            } else {
                balance = newBalance;
                animateBalance(from, newBalance);
            }

            setChipsEnabled(true);
            busy = false;
            refreshButtons();
            applyStates();
            updateStats();

            statusBanner.className = 'status-banner win';
            statusBanner.innerText = `CASHED OUT ${fmt(winAmount)} (${mult.toFixed(2)}x)`;
            notify(`WON ৳${winAmount.toFixed(2)} (${mult.toFixed(2)}x)`, 'win');
        }

        // ---------------------------------------------------------------------------
        // FX
        // ---------------------------------------------------------------------------
        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

        function shakeScreen() {
            app.classList.add('shake');
            setTimeout(() => app.classList.remove('shake'), 460);
        }

        function clearFx() {
            fxLayer.innerHTML = '';
        }

        function spawnFeathers() {
            const cx = viewport.clientWidth / 2;
            const cy = viewport.clientHeight - 70;
            for (let i = 0; i < 14; i++) {
                const f = document.createElement('div');
                f.className = 'feather';
                const ang = Math.random() * Math.PI * 2;
                const dist = 60 + Math.random() * 120;
                const dx = Math.cos(ang) * dist;
                const dy = Math.sin(ang) * dist - 40;
                f.style.left = `${cx}px`;
                f.style.top = `${cy}px`;
                f.style.transform = `rotate(${Math.random() * 360}deg)`;
                fxLayer.appendChild(f);
                const dur = 900 + Math.random() * 700;
                f.animate([
                    { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0.9, offset: 0.55 },
                    { transform: `translate(${dx * 1.15}px, ${dy + 160}px) rotate(${Math.random() * 900}deg)`, opacity: 0 }
                ], { duration: dur, easing: 'ease-out' });
                setTimeout(() => f.remove(), dur);
            }
        }

        function spawnPoof() {
            const cx = viewport.clientWidth / 2;
            const cy = viewport.clientHeight - 70;
            for (let i = 0; i < 7; i++) {
                const p = document.createElement('div');
                p.className = 'poof';
                const size = 26 + Math.random() * 34;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${cx}px`;
                p.style.top = `${cy}px`;
                fxLayer.appendChild(p);
                const dx = (Math.random() - 0.5) * 90;
                const dy = -20 - Math.random() * 70;
                p.animate([
                    { transform: 'translate(-50%,-50%) scale(0.3)', opacity: 0.85 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.6)`, opacity: 0 }
                ], { duration: 800 + Math.random() * 300, easing: 'ease-out' });
                setTimeout(() => p.remove(), 1100);
            }
        }

        function spawnDust() {
            const cx = viewport.clientWidth / 2;
            const cy = viewport.clientHeight - 70;
            for (let i = 0; i < 6; i++) {
                const d = document.createElement('div');
                d.className = 'dust';
                d.style.left = `${cx}px`;
                d.style.top = `${cy}px`;
                fxLayer.appendChild(d);
                const dx = (Math.random() - 0.5) * 80;
                d.animate([
                    { transform: 'translate(-50%,-50%) scale(0.4)', opacity: 0.8 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% - 14px)) scale(1.4)`, opacity: 0 }
                ], { duration: 520, easing: 'ease-out' });
                setTimeout(() => d.remove(), 560);
            }
        }

        function spawnCoinBurst() {
            const cx = viewport.clientWidth / 2;
            const cy = viewport.clientHeight - 90;
            for (let i = 0; i < 8; i++) {
                const c = document.createElement('div');
                c.textContent = '🪙';
                c.style.position = 'absolute';
                c.style.left = `${cx}px`;
                c.style.top = `${cy}px`;
                c.style.fontSize = '1.1rem';
                fxLayer.appendChild(c);
                const dx = (Math.random() - 0.5) * 120;
                const dy = -60 - Math.random() * 70;
                c.animate([
                    { transform: 'translate(-50%,-50%) scale(0.6)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2)`, opacity: 1, offset: 0.6 },
                    { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + 90px)) scale(0.9)`, opacity: 0 }
                ], { duration: 1000, easing: 'ease-out', delay: i * 35 });
                setTimeout(() => c.remove(), 1100 + i * 35);
            }
        }

        function spawnConfetti() {
            const colors = ['#ffd23f', '#ff3b5c', '#39ff88', '#4ea8ff', '#c77dff', '#ff9f1c'];
            for (let i = 0; i < 46; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = `${Math.random() * viewport.clientWidth}px`;
                c.style.background = colors[i % colors.length];
                c.style.transform = `rotate(${Math.random() * 360}deg)`;
                fxLayer.appendChild(c);
                const dur = 1600 + Math.random() * 1400;
                const drift = (Math.random() - 0.5) * 120;
                c.animate([
                    { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(${viewport.clientHeight + 40}px) rotate(${Math.random() * 720 + 360}deg) translateX(${drift}px)`, opacity: 1 }
                ], { duration: dur, easing: 'linear', delay: Math.random() * 500 });
                setTimeout(() => c.remove(), dur + 600);
            }
        }

        // ---------------------------------------------------------------------------
        // Notifications
        // ---------------------------------------------------------------------------
        function notify(text, type) {
            const area = document.getElementById('notification-area');
            if (!area) return;
            const note = document.createElement('div');
            note.style.cssText = `
                background: ${type === 'win' ? '#16c46b' : '#ff3b5c'};
                color: white; padding: 11px 20px; border-radius: 12px;
                margin-bottom: 9px; font-weight: 900; font-size: 0.85rem;
                box-shadow: 0 10px 20px rgba(0,0,0,0.35);
                transform: translateY(-20px); opacity: 0;
                transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);`;
            note.innerText = text;
            area.appendChild(note);
            setTimeout(() => { note.style.transform = 'translateY(0)'; note.style.opacity = '1'; }, 10);
            setTimeout(() => {
                note.style.transform = 'translateY(-20px)';
                note.style.opacity = '0';
                setTimeout(() => note.remove(), 300);
            }, 3800);
        }

        // ---------------------------------------------------------------------------
        // Init
        // ---------------------------------------------------------------------------
        function init() {
            if (!GameBridge.isLoggedIn()) notify('Please login to play!', 'err');
            ladder = buildLadder(DIFFICULTIES[difficultyKey].growth, lanes);
            buildDifficultyChips();
            buildRoad();
            applyStates();
            startTraffic();
            renderBalance();
            updateStats();
            refreshButtons();
            setChickenState('idle');
            addEventListeners();
            window.addEventListener('resize', () => {
                const laneEls = track.querySelectorAll('.lane');
                if (laneEls.length >= 2) {
                    const a = laneEls[laneEls.length - 1].getBoundingClientRect().top;
                    const b = laneEls[laneEls.length - 2].getBoundingClientRect().top;
                    stepPx = Math.abs(b - a) || 70;
                    scrollToLane();
                }
            });
        }

        init();
    </script>
</body>

</html>
