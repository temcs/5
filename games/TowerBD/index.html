<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TowerBD - Stairs Climb</title>
    <style>
:root {
    --bg-dark: #0a0b10;
    --card-bg: #141621;
    --accent-yellow: #ffcc00;
    --accent-red: #ff2d55;
    --accent-green: #2ecc71;
    --text-main: #ffffff;
    --text-muted: #8a8e9e;
    --font-primary: 'Inter', sans-serif;
    --font-display: 'Outfit', sans-serif;
    --door-bg: #2a2e3e;
    --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-primary);
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 620px;
    height: 92vh;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 204, 0, 0.08), transparent 50%);
    overflow: hidden;
}

.game-header {
    padding: 18px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.home-btn {
    cursor: pointer;
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    font-weight: 700;
    transition: var(--transition);
}

.home-btn:hover {
    background: rgba(255, 204, 0, 0.2);
}

.logo-text {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 900;
}

.logo-text .accent {
    color: var(--accent-yellow);
}

.balance-container {
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 22px;
    border-radius: 50px;
    border: 1px solid rgba(255, 204, 0, 0.2);
    text-align: center;
}

.balance-label {
    display: block;
    font-size: 0.6rem;
    color: var(--text-muted);
    font-weight: 800;
}

.balance-value {
    color: var(--accent-yellow);
    font-weight: 900;
    font-size: 1.1rem;
    font-family: var(--font-display);
}

.game-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 18px 24px;
    min-height: 0;
}

.game-board {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
}

/* Tower */
.tower {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 7px;
    overflow-y: auto;
    padding: 10px 6px;
    scrollbar-width: none;
}

.tower::-webkit-scrollbar {
    display: none;
}

.floor {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.22);
    border: 2px solid transparent;
    transition: var(--transition);
    flex-shrink: 0;
}

.floor-info {
    width: 78px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex-shrink: 0;
}

.floor-num {
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--text-muted);
}

.floor-mult {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 1.05rem;
    color: var(--accent-yellow);
}

.doors {
    flex: 1;
    display: flex;
    gap: 10px;
}

.door {
    flex: 1;
    height: 46px;
    border-radius: 10px;
    background: var(--door-bg);
    border: 2px solid rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5b6178;
    font-size: 1.15rem;
    cursor: default;
    pointer-events: none;
    transition: var(--transition);
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3);
}

/* States */
.floor.locked {
    opacity: 0.45;
}

.floor.passed {
    background: rgba(46, 204, 113, 0.06);
    border-color: rgba(46, 204, 113, 0.25);
}

.floor.active {
    background: rgba(255, 204, 0, 0.07);
    border-color: var(--accent-yellow);
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.15);
}

.floor.active .door {
    pointer-events: auto;
    cursor: pointer;
}

.floor.active .door:hover {
    background: #363b4e;
    transform: translateY(-2px);
    border-color: var(--accent-yellow);
    color: var(--accent-yellow);
}

.door.revealed {
    pointer-events: none;
    cursor: default;
}

.door.door-safe {
    background: rgba(46, 204, 113, 0.15);
    border-color: var(--accent-green);
    color: var(--accent-green);
}

.door.door-skull {
    background: rgba(255, 45, 85, 0.15);
    border-color: var(--accent-red);
    color: var(--accent-red);
    animation: shake 0.4s ease;
}

.door.door-dim {
    opacity: 0.3;
}

@keyframes shake {

    0%,
    100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-4px);
    }

    75% {
        transform: translateX(4px);
    }
}

.game-status {
    margin-top: 12px;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: center;
    flex-shrink: 0;
}

/* Controls */
.controls-container {
    background: rgba(0, 0, 0, 0.2);
    padding: 18px 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
}

.bet-panel {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
}

.bet-input-group {
    background: #1c1f2d;
    padding: 8px 10px;
    border-radius: 15px;
    display: flex;
    align-items: center;
}

.adjust-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #2a2e3e;
    background: transparent;
    color: white;
    font-weight: 800;
    cursor: pointer;
    transition: var(--transition);
}

.adjust-btn:hover {
    background: rgba(255, 255, 255, 0.08);
}

#bet-amount {
    background: transparent;
    border: none;
    color: white;
    width: 80px;
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    outline: none;
}

#bet-amount::-webkit-inner-spin-button {
    -webkit-appearance: none;
}

.action-buttons {
    display: flex;
    gap: 12px;
}

.action-btn {
    height: 58px;
    padding: 0 26px;
    border-radius: 15px;
    border: none;
    font-weight: 900;
    font-family: var(--font-display);
    cursor: pointer;
    transition: var(--transition);
}

.bet-mode {
    background: var(--accent-yellow);
    color: black;
    font-size: 1.05rem;
}

.cashout-mode {
    background: var(--accent-green);
    color: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-width: 130px;
}

.cashout-mode .small-txt {
    font-size: 0.65rem;
    opacity: 0.8;
}

.cashout-mode .cashout-amount {
    font-size: 1.15rem;
}

.action-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.action-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

#notification-area {
    position: fixed;
    top: 100px;
    right: 20px;
    z-index: 1000;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 600px) {
    body {
        height: 100dvh;
        overflow: hidden;
    }

    .app-container {
        height: 100dvh;
        border-radius: 0;
        max-width: 100%;
    }

    .game-header {
        padding: 12px 15px;
    }

    .logo-text {
        font-size: 1.1rem;
    }

    .balance-container {
        padding: 5px 14px;
    }

    .balance-value {
        font-size: 0.9rem;
    }

    .game-main {
        padding: 10px 12px;
    }

    .tower {
        gap: 5px;
        padding: 4px 0;
    }

    .floor {
        padding: 6px 8px;
        gap: 8px;
    }

    .floor-info {
        width: 58px;
    }

    .floor-mult {
        font-size: 0.9rem;
    }

    .doors {
        gap: 6px;
    }

    .door {
        height: 40px;
        font-size: 1rem;
    }

    .game-status {
        font-size: 0.9rem;
        margin-top: 8px;
    }

    .controls-container {
        padding: 12px;
    }

    .bet-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .bet-input-group {
        justify-content: space-between;
    }

    #bet-amount {
        width: 60px;
    }

    .action-buttons {
        grid-column: span 2;
        width: 100%;
    }

    .action-btn {
        height: 50px;
        padding: 0 12px;
        flex: 1;
        font-size: 0.95rem;
    }

    .cashout-mode {
        min-width: 0;
    }
}

.auto-toggle input{accent-color:#ffcc00;width:15px;height:15px;cursor:pointer;}
.auto-label{font-weight:800;font-size:.75rem;letter-spacing:1px;color:#cfd3dc;}
@media (max-width: 600px), (max-height: 620px) {
    html,
    body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
    }

    body {
        align-items: flex-start;
    }

    .app-container {
        height: auto;
        min-height: 100dvh;
    }

    .game-main {
        flex: none;
        overflow: visible;
    }

    .tower {
        flex: 0 0 auto;
        overflow: visible;
    }
}

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                <div class="home-btn" onclick="GameBridge.goHome()">
                    <i class="fas fa-home"></i> <span>HOME</span>
                </div>
                <span class="logo-text">TOWER<span class="accent">BD</span></span>
            </div>
            <div class="balance-container">
                <span class="balance-label">YOUR BALANCE</span>
                <span class="balance-value" id="balance-amount">৳0.00</span>
            </div>
        </header>

        <main class="game-main">
            <div class="game-board">
                <div class="tower" id="tower">
                    <!-- Floors generated here -->
                </div>
                <div class="game-status" id="game-status">PRESS START TO CLIMB</div>
            </div>

            <!-- Controls -->
            <div class="controls-container">
                <div class="bet-panel">
                    <div class="bet-input-group">
                        <button class="adjust-btn" id="minus-bet">-</button>
                        <input type="number" id="bet-amount" value="10" step="1" min="1">
                        <button class="adjust-btn" id="plus-bet">+</button>
                    </div>

                    <div class="auto-toggle"><input type="checkbox" id="auto-spin-switch"><span class="auto-label"><i class="fas fa-rotate"></i> AUTO BET</span></div>
                    <div class="action-buttons">
                        <button class="action-btn bet-mode" id="play-btn">START GAME</button>
                        <button class="action-btn cashout-mode" id="cashout-btn" disabled>
                            <span class="small-txt">CASHOUT</span>
                            <span class="cashout-amount" id="cashout-val">0.00</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <div id="notification-area"></div>
    </div>
    <script src="../balancer.js?v=5"></script>
    <script>
// ---------------------------------------------------------------------------
// TowerBD / LadderRun - Stairs Climb
// A 7-to-9 floor tower. Each floor has 3 doors (2 safe, 1 skull).
// Clear a floor to bump the multiplier; hit a skull and lose the bet.
// The per-reveal win chance is controlled from the admin panel.
// ---------------------------------------------------------------------------

const CONFIG = {
    MIN_FLOORS: 7,
    MAX_FLOORS: 9,
    DOORS: 3,
    MIN_BET: 1
};

// Fixed multiplier ladder (index 0 => clearing floor 1).
// Early floors are the common 1x-5x wins; the top floor is the rare 50x.
const MULT_LADDER = [1.20, 1.90, 3.05, 4.85, 7.75, 12.35, 19.65, 31.35, 50.00];

// State
let balance = GameBridge.getBalance();
let currentBet = 10;
let floorsCount = 8;
let skullIndices = [];          // skull door index per floor (0-based floor)
let clearedFloors = 0;
let gameState = 'idle';         // idle | playing | lost | won
let winChance = 50;             // Admin-configurable win chance per door (%)

// Load admin-configured win chance
GameBridge.getGameConfig().then(cfg => {
    if (cfg && typeof cfg.winChance === 'number') winChance = cfg.winChance;
});
GameBridge.onGameConfigUpdate(cfg => {
    if (cfg && typeof cfg.winChance === 'number') winChance = cfg.winChance;
});

// DOM Elements
const balanceDisplay = document.getElementById('balance-amount');
const betInput = document.getElementById('bet-amount');
const towerEl = document.getElementById('tower');
const statusDisplay = document.getElementById('game-status');
const playBtn = document.getElementById('play-btn');
const cashoutBtn = document.getElementById('cashout-btn');
const cashoutVal = document.getElementById('cashout-val');

function init() {
    if (!GameBridge.isLoggedIn()) {
        notify('Please login to play!', 'err');
    }
    updateBalanceDisplay();
    buildTower();
    applyFloorStates();
    addEventListeners();
}

function updateBalanceDisplay() {
    balanceDisplay.innerText = `৳${balance.toFixed(2)}`;
}

// ---------------------------------------------------------------------------
// Tower rendering
// ---------------------------------------------------------------------------
function buildTower() {
    towerEl.innerHTML = '';
    // Render highest floor first so the player climbs upward
    for (let f = floorsCount; f >= 1; f--) {
        const mult = MULT_LADDER[f - 1] || 0;

        const floor = document.createElement('div');
        floor.className = 'floor';
        floor.dataset.floor = f;

        let doorsHtml = '';
        for (let t = 0; t < CONFIG.DOORS; t++) {
            doorsHtml += `<div class="door" data-tile="${t}"><i class="fas fa-door-closed"></i></div>`;
        }

        floor.innerHTML = `
            <div class="floor-info">
                <span class="floor-num">FL ${f}</span>
                <span class="floor-mult">${mult.toFixed(2)}x</span>
            </div>
            <div class="doors">${doorsHtml}</div>
        `;

        floor.querySelectorAll('.door').forEach(door => {
            door.addEventListener('click', () => handleDoorClick(f, parseInt(door.dataset.tile)));
        });

        towerEl.appendChild(floor);
    }

    // Keep the active floor visible
    const active = towerEl.querySelector('.floor.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
}

function getFloorEl(f) {
    return towerEl.querySelector(`.floor[data-floor="${f}"]`);
}

// Highlight the active floor and dim the rest
function applyFloorStates() {
    const activeFloor = clearedFloors + 1;

    towerEl.querySelectorAll('.floor').forEach(floor => {
        const f = parseInt(floor.dataset.floor);
        floor.classList.remove('active', 'passed', 'locked');

        if (f <= clearedFloors) {
            floor.classList.add('passed');
        } else if (gameState === 'playing' && f === activeFloor) {
            floor.classList.add('active');
        } else if (gameState === 'idle' || gameState === 'playing') {
            floor.classList.add('locked');
        }
    });
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
function addEventListeners() {
    document.getElementById('plus-bet').addEventListener('click', () => {
        if (gameState !== 'idle') return;
        betInput.value = GameBridge.formatBetAmount(parseFloat(betInput.value) + 10);
    });

    document.getElementById('minus-bet').addEventListener('click', () => {
        if (gameState !== 'idle') return;
        const val = parseFloat(betInput.value);
        if (val > 10) betInput.value = GameBridge.formatBetAmount(val - 10);
    });

    playBtn.addEventListener('click', startGame);
    cashoutBtn.addEventListener('click', cashOut);
}

// ---------------------------------------------------------------------------
// Gameplay
// ---------------------------------------------------------------------------
async function startGame() {
    if (!GameBridge.isLoggedIn()) {
        notify('Please login first!', 'err');
        return;
    }

    const amount = parseFloat(betInput.value);
    if (!(amount >= CONFIG.MIN_BET)) {
        notify(`Minimum bet is ৳${CONFIG.MIN_BET}`, 'err');
        return;
    }
    if (amount > balance) {
        notify('Insufficient balance!', 'err');
        return;
    }

    gameState = 'playing';
    currentBet = amount;
    balance -= currentBet;
    updateBalanceDisplay();

    // Sync deduction to database
    const sync = await GameBridge.updateBalance(balance, -amount, `Bet on Tower`);

    if (sync && sync.error) {
        balance += currentBet;
        updateBalanceDisplay();
        gameState = 'idle';
        notify('Sync Error: Bet not placed. Please try again.', 'err');
        return;
    }

    // New tower each round (random number of floors)
    floorsCount = Math.floor(Math.random() * (CONFIG.MAX_FLOORS - CONFIG.MIN_FLOORS + 1)) + CONFIG.MIN_FLOORS;
    skullIndices = [];
    for (let f = 0; f < floorsCount; f++) {
        skullIndices.push(Math.floor(Math.random() * CONFIG.DOORS));
    }
    clearedFloors = 0;

    buildTower();
    applyFloorStates();

    statusDisplay.innerText = 'CLIMB! PICK A SAFE DOOR';
    statusDisplay.style.color = 'var(--accent-yellow)';

    playBtn.disabled = true;
    playBtn.innerText = 'GAME IN PROGRESS';

    cashoutBtn.disabled = true;
    cashoutVal.innerText = '0.00';

    const active = towerEl.querySelector('.floor.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Relocate a floor's skull away from the given door
function moveSkullAway(floorIdx, fromTile) {
    const others = [];
    for (let t = 0; t < CONFIG.DOORS; t++) {
        if (t !== fromTile) others.push(t);
    }
    skullIndices[floorIdx] = others[Math.floor(Math.random() * others.length)];
}

async function handleDoorClick(floorNum, tile) {
    if (gameState !== 'playing') return;
    if (floorNum !== clearedFloors + 1) return; // only the active floor is playable

    const floorIdx = floorNum - 1;

    // Bias this reveal using the admin-configured win chance
    const shouldBeSafe = Math.random() * 100 < winChance;
    const isSkull = skullIndices[floorIdx] === tile;

    if (shouldBeSafe && isSkull) {
        moveSkullAway(floorIdx, tile);
    } else if (!shouldBeSafe && !isSkull) {
        skullIndices[floorIdx] = tile;
    }

    const floorEl = getFloorEl(floorNum);
    const doors = floorEl.querySelectorAll('.door');
    const doorEl = doors[tile];

    if (skullIndices[floorIdx] === tile) {
        // ---- HIT A SKULL ----
        doorEl.classList.add('door-skull', 'revealed');
        doorEl.innerHTML = '<i class="fas fa-skull"></i>';

        // Reveal the safe doors on this floor too
        doors.forEach((d, t) => {
            if (t !== tile) {
                d.classList.add('door-safe', 'revealed');
                d.innerHTML = '<i class="fas fa-gem"></i>';
            }
        });

        gameState = 'lost';
        gameOver('YOU FELL! HIT A SKULL', 'err');
    } else {
        // ---- SAFE ----
        doorEl.classList.add('door-safe', 'revealed');
        doorEl.innerHTML = '<i class="fas fa-gem"></i>';

        doors.forEach((d, t) => {
            if (t !== tile) d.classList.add('door-dim');
        });

        clearedFloors++;

        if (clearedFloors >= floorsCount) {
            // Perfect climb - auto cashout
            await cashOut();
        } else {
            const mult = MULT_LADDER[clearedFloors - 1];
            cashoutBtn.disabled = false;
            cashoutVal.innerText = (currentBet * mult).toFixed(2);
            applyFloorStates();
            const active = towerEl.querySelector('.floor.active');
            if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }
}

async function cashOut() {
    if (gameState !== 'playing' || clearedFloors === 0) return;

    const mult = GameBridge.capWinMultiplier(MULT_LADDER[clearedFloors - 1]);
    const winAmount = currentBet * mult;

    balance += winAmount;
    updateBalanceDisplay();

    // Sync win
    await GameBridge.updateBalance(balance, winAmount, `Win on Tower`);

    gameState = 'won';
    gameOver(`YOU WON ৳${winAmount.toFixed(2)}`, 'win');
}

function gameOver(msg, type) {
    statusDisplay.innerText = msg;
    statusDisplay.style.color = type === 'win' ? 'var(--accent-green)' : 'var(--accent-red)';

    playBtn.disabled = false;
    playBtn.innerText = 'START NEW GAME';

    cashoutBtn.disabled = true;

    applyFloorStates();
    notify(msg, type);

    // Autobet: automatically start a new game if enabled
    if (document.getElementById('auto-spin-switch').checked) {
        setTimeout(() => {
            if (gameState === 'won' || gameState === 'lost') startGame();
        }, 1200);
    }
}

function notify(text, type) {
    const area = document.getElementById('notification-area');
    const note = document.createElement('div');
    note.style.cssText = `
        background: ${type === 'win' ? '#2ecc71' : '#ff2d55'};
        color: white; padding: 12px 25px; border-radius: 12px;
        margin-bottom: 10px; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    `;
    note.innerText = text;
    area.appendChild(note);

    setTimeout(() => {
        note.style.transform = 'translateY(0)';
        note.style.opacity = '1';
    }, 10);
    setTimeout(() => {
        note.style.transform = 'translateY(-20px)';
        note.style.opacity = '0';
        setTimeout(() => note.remove(), 300);
    }, 4000);
}
